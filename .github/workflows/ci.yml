name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Go test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          # Ask Git for tracked source files so repository/tool caches are
          # never traversed and Windows path regexes are unnecessary.
          $files = @(git ls-files -- '*.go')
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted.Count -gt 0) {
            Write-Host "Unformatted Go files:"
            $unformatted | Write-Host
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI binaries
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\ostom.exe" .\cmd\ostom
          go build -o "$env:RUNNER_TEMP\ostom-fixture.exe" .\cmd\ostom-fixture

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build release binaries
        shell: pwsh
        run: |
          $archive = "ostom-$env:GITHUB_REF_NAME-windows-amd64.zip"
          $staging = Join-Path $env:RUNNER_TEMP "ostom-windows-amd64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          go build -trimpath -o "$staging\ostom.exe" .\cmd\ostom
          Compress-Archive -Path "$staging\ostom.exe" -DestinationPath "$env:RUNNER_TEMP\$archive" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Windows download

          Download ``ostom-$env:GITHUB_REF_NAME-windows-amd64.zip`` and extract ``ostom.exe``.
          The archive is for 64-bit Windows (amd64).

          OSTOM is a read-only, local-first tool: it exports readable indexed
          messages and attachments, while bounded native recovery remains
          best-effort. See the README for supported cases and limitations.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          gh release create "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP\ostom-$env:GITHUB_REF_NAME-windows-amd64.zip" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
