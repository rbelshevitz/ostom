name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Go test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          # Ask Git for tracked source files so repository/tool caches are
          # never traversed and Windows path regexes are unnecessary.
          $files = @(git ls-files -- '*.go')
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted.Count -gt 0) {
            Write-Host "Unformatted Go files:"
            $unformatted | Write-Host
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI binaries
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\ostom.exe" .\cmd\ostom
          go build -o "$env:RUNNER_TEMP\ostom-fixture.exe" .\cmd\ostom-fixture

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build release binaries
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\ostom.exe" .\cmd\ostom
          go build -trimpath -o "$env:RUNNER_TEMP\ostom-fixture.exe" .\cmd\ostom-fixture

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP\ostom.exe" "$env:RUNNER_TEMP\ostom-fixture.exe" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes
