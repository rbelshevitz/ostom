name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Go test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          architecture: x64

      - name: Check formatting
        shell: pwsh
        run: |
          # Ask Git for tracked source files so repository/tool caches are
          # never traversed and Windows path regexes are unnecessary.
          $files = @(git ls-files -- '*.go')
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted.Count -gt 0) {
            Write-Host "Unformatted Go files:"
            $unformatted | Write-Host
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o "$env:RUNNER_TEMP\ostom.exe" .\cmd\ostom
          go build -o "$env:RUNNER_TEMP\ostom-fixture.exe" .\cmd\ostom-fixture

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $guiOut = Join-Path $env:RUNNER_TEMP "ostom-gui"
          dotnet publish .\gui\Ostom.Gui\Ostom.Gui.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o $guiOut
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          architecture: x64

      - name: Build release binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $archive = "ostom-$env:GITHUB_REF_NAME-windows-amd64.zip"
          $staging = Join-Path $env:RUNNER_TEMP "ostom-windows-amd64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          go build -trimpath -o "$staging\ostom.exe" .\cmd\ostom
          dotnet publish .\gui\Ostom.Gui\Ostom.Gui.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o $staging
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path "$staging\ostom.exe", "$staging\ostom-gui.exe" -DestinationPath "$env:RUNNER_TEMP\$archive" -Force
          $checksum = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\$archive" -Algorithm SHA256).Hash
          Set-Content -Path $checksum -Value "$hash  $archive"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## OSTOM $env:GITHUB_REF_NAME

          Read-only extraction and export of readable mail from Outlook OST/PST
          files. The package includes the CLI and a small Windows GUI.

          Download ``ostom-$env:GITHUB_REF_NAME-windows-amd64.zip`` for 64-bit
          Windows. The GUI requires the .NET 8 Desktop Runtime.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          $asset = "$env:RUNNER_TEMP\ostom-$env:GITHUB_REF_NAME-windows-amd64.zip"
          $checksums = "$env:RUNNER_TEMP\SHA256SUMS.txt"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
            gh release upload "$env:GITHUB_REF_NAME" "$asset" "$checksums" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" "$asset" "$checksums" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
          }
