name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Go test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          # Ask Git for tracked source files so repository/tool caches are
          # never traversed and Windows path regexes are unnecessary.
          $files = @(git ls-files -- '*.go')
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted.Count -gt 0) {
            Write-Host "Unformatted Go files:"
            $unformatted | Write-Host
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o "$env:RUNNER_TEMP\ostom.exe" .\cmd\ostom
          go build -o "$env:RUNNER_TEMP\ostom-fixture.exe" .\cmd\ostom-fixture

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build release binaries
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $archive = "ostom-$env:GITHUB_REF_NAME-windows-amd64.zip"
          $staging = Join-Path $env:RUNNER_TEMP "ostom-windows-amd64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          go build -trimpath -o "$staging\ostom.exe" .\cmd\ostom
          Compress-Archive -Path "$staging\ostom.exe" -DestinationPath "$env:RUNNER_TEMP\$archive" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## OSTOM $env:GITHUB_REF_NAME

          Safe, local-first recovery of readable data from Outlook ``.ost`` and
          ``.pst`` files without modifying the source.

          ### Highlights

          - Per-message ``.eml`` fallback for readable indexed mail, alongside
            Thunderbird-compatible ``mbox + .sbd`` export.
          - Bounded native recovery for message and attachment candidates from
            NBT/BBT → HN/PC/subnode structures.
          - Native attachment candidates preserve their association with the
            message candidate, filename, declared/readable sizes, ``Content-ID``
            and MIME role when readable.
          - Inline attachments use MIME ``Content-ID`` and
            ``Content-Disposition: inline``.
          - Indexed parsing supports 4 KiB B-tree pages and compressed blocks;
            the public [GroupDocs OST sample](https://docs.groupdocs.com/conversion/java/load-personal-storage-pst-or-ost-with-options/)
            smoke test exported 12 messages and 4 attachments.

          ### Download

          Download ``ostom-$env:GITHUB_REF_NAME-windows-amd64.zip`` and extract
          ``ostom.exe``. The archive is for 64-bit Windows (amd64).

          ### Important limitations

          Indexed attachments are exported through the reader's attachment
          table using streaming output. Native attachment payloads remain
          memory-bounded (32 MiB by default) and may be ``partial`` or
          ``unavailable``. Arbitrary attachment-stream trees, complete recovery
          of damaged attachment tables, embedded-message ``.eml`` extraction,
          and native/orphan attachment-tree recovery are still under
          investigation. The 4 KiB smoke test is not exhaustive coverage of
          every attachment, compression, or encryption variant.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          $asset = "$env:RUNNER_TEMP\ostom-$env:GITHUB_REF_NAME-windows-amd64.zip"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
            gh release upload "$env:GITHUB_REF_NAME" "$asset" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" "$asset" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
          }
