name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Go test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.go |
            Where-Object { $_.FullName -notmatch '\\(\.gopath|\.gomodcache|\.gobuildcache)\\' }
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted.Count -gt 0) {
            Write-Host "Unformatted Go files:"
            $unformatted | Write-Host
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI binaries
        run: go build ./cmd/ostom ./cmd/ostom-fixture
